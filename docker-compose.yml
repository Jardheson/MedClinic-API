services:
  postgres:
    image: postgres:16-alpine
    container_name: medclinic-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-medclinic}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - '${POSTGRES_PORT:-5433}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: medclinic-api
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    environment:
      PORT: ${PORT:-3000}
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      DB_NAME: ${POSTGRES_DB:-medclinic}
      DB_SSL_ENABLED: "false"
      TEST_DB_HOST: postgres
      TEST_DB_PORT: 5432
      TEST_DB_USER: ${POSTGRES_USER:-postgres}
      TEST_DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      TEST_DB_NAME: ${TEST_DB_NAME:-medclinic_test}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-1234}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1d}
      RUN_ADMIN_SEED: ${RUN_ADMIN_SEED:-true}
      ADMIN_SEED_NAME: ${ADMIN_SEED_NAME:-Administrador MedClinic}
      ADMIN_SEED_EMAIL: ${ADMIN_SEED_EMAIL:-admin@medclinic.local}
      ADMIN_SEED_PASSWORD: ${ADMIN_SEED_PASSWORD:-SenhaForte123!}
    ports:
      - '${PORT:-3000}:3000'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3000/api/v1/health >/dev/null 2>&1 || exit 1']
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  postgres_data:
